name: Deploy DTA Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Setup SSH key
        run: |
          set -e
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dta_key
          chmod 600 ~/.ssh/dta_key

      - name: Validate SSH key
        run: |
          set -e
          ssh-keygen -y -f ~/.ssh/dta_key > /dev/null
          echo "SSH key is valid"

      - name: Test SSH connection
        run: |
          set -e
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} "echo SSH connected successfully"

      - name: Deploy to EC2
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
              set -e

              APP_DIR="/home/ubuntu/DTA"

              echo "Moving to project directory..."
              cd "$APP_DIR"

              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main

              echo "Updating backend..."
              cd Backend

              if [ ! -d "venv" ]; then
                python3 -m venv venv
              fi

              source venv/bin/activate
              pip install --upgrade pip
              pip install -r requirements.txt
              pip install gunicorn uvicorn

              echo "Restarting backend service..."
              sudo systemctl restart dta-backend
              sudo systemctl status dta-backend --no-pager || true

              echo "Updating frontend..."
              cd ../Frontend

              # Install Node.js 20 if not already available
              if ! command -v node >/dev/null 2>&1 || ! node -v | grep -qE '^v2[0-9]\.'; then
                echo "Installing Node.js 20..."
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi

              echo "Node version: $(node -v)"
              echo "NPM version: $(npm -v)"

              rm -rf node_modules
              rm -f package-lock.json

              npm install
              npm run build

              echo "Deploying frontend build..."
              sudo rm -rf /var/www/html/*

              if [ -d "build" ]; then
                sudo cp -r build/. /var/www/html/
              elif [ -d "dist" ]; then
                sudo cp -r dist/. /var/www/html/
              else
                echo "No build or dist folder found"
                exit 1
              fi

              echo "Checking nginx config..."
              sudo nginx -t

              echo "Restarting nginx..."
              sudo systemctl restart nginx
              sudo systemctl status nginx --no-pager || true

              echo "Deployment completed successfully."
          EOF
