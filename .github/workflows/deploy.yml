name: Deploy DTA Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dta_key
          chmod 600 ~/.ssh/dta_key

      - name: Validate SSH key
        shell: bash
        run: |
          set -e
          ssh-keygen -y -f ~/.ssh/dta_key > /dev/null
          echo "SSH key is valid"

      - name: Test SSH connection
        shell: bash
        run: |
          set -e
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} "echo SSH connected successfully"

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh -T \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
          set -euo pipefail

          export DEBIAN_FRONTEND=noninteractive

          APP_DIR="/home/ubuntu/DTA"
          FRONTEND_DIR="$APP_DIR/Frontend"
          BACKEND_DIR="$APP_DIR/Backend"

          echo "$(date) Moving to project directory..."
          cd "$APP_DIR"

          echo "$(date) Pulling latest code..."
          git fetch origin
          git reset --hard origin/main

          echo "$(date) Current deployed commit:"
          git rev-parse HEAD
          git log --oneline -1

          echo "$(date) ================= BACKEND DEPLOY ================="
          cd "$BACKEND_DIR"

          if [ ! -d "venv" ]; then
            python3 -m venv venv
          fi

          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install gunicorn uvicorn

          echo "$(date) Restarting backend service..."
          sudo systemctl restart dta-backend
          sudo systemctl is-active dta-backend || true

          echo "$(date) ================= FRONTEND DEPLOY ================="
          cd "$FRONTEND_DIR"

          echo "$(date) Ensuring Node.js 18 is installed..."
          if ! command -v node >/dev/null 2>&1 || ! node -v | grep -qE '^v18\.'; then
            curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
            sudo apt-get update
            sudo apt-get install -y nodejs
          fi

          echo "$(date) Node version: $(node -v)"
          echo "$(date) NPM version: $(npm -v)"

          test -f package.json || { echo "Error: package.json not found"; exit 1; }

          echo "$(date) Checking dependencies in package.json..."
          grep -n '"dompurify"' package.json || echo "dompurify not found in package.json"
          grep -n '"react-quill"' package.json || echo "react-quill not found in package.json"
          grep -n '"quill"' package.json || echo "quill not found in package.json"

          echo "$(date) Cleaning old frontend install..."
          rm -rf node_modules package-lock.json build dist

          echo "$(date) Cleaning npm cache..."
          npm cache clean --force

          echo "$(date) Installing frontend dependencies..."
          npm install --legacy-peer-deps --no-audit --no-fund

          echo "$(date) Fixing CRA compatibility dependencies..."
          npm install --save-dev --legacy-peer-deps \
            @babel/plugin-proposal-private-property-in-object \
            ajv@8 \
            ajv-keywords@5

          echo "$(date) Verifying installed packages..."
          npm ls dompurify || true
          npm ls react-quill || true
          npm ls quill || true
          npm ls jest-worker || true
          npm ls ajv || true
          npm ls ajv-keywords || true

          echo "$(date) Building frontend..."
          CI=false npm run build

          echo "$(date) Deploying frontend build..."
          sudo rm -rf /var/www/html/*

          if [ -d "build" ]; then
            sudo cp -r build/. /var/www/html/
          elif [ -d "dist" ]; then
            sudo cp -r dist/. /var/www/html/
          else
            echo "Error: No build or dist folder found"
            exit 1
          fi

          echo "$(date) Setting ownership and permissions..."
          sudo chown -R www-data:www-data /var/www/html
          sudo find /var/www/html -type d -exec chmod 755 {} \;
          sudo find /var/www/html -type f -exec chmod 644 {} \;

          echo "$(date) Checking nginx config..."
          sudo nginx -t

          echo "$(date) Restarting nginx..."
          sudo systemctl restart nginx
          sudo systemctl is-active nginx || true

          echo "$(date) Deployment completed successfully."
          EOF
