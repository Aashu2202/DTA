name: Deploy DTA Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          set -e
          mkdir -p ~/.ssh
          printf "%s" "${{ secrets.EC2_SSH_KEY }}" | tr -d '\r' > ~/.ssh/dta_key
          chmod 600 ~/.ssh/dta_key

      - name: Validate SSH key
        shell: bash
        run: |
          set -e
          ssh-keygen -y -f ~/.ssh/dta_key > /dev/null
          echo "SSH key is valid"

      - name: Test SSH connection
        shell: bash
        run: |
          set -e
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} "echo SSH connected successfully"

      - name: Deploy to EC2
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -i ~/.ssh/dta_key \
            ubuntu@${{ secrets.EC2_HOST }} << 'EOF'
              set -e

              export DEBIAN_FRONTEND=noninteractive

              APP_DIR="/home/ubuntu/DTA"
              FRONTEND_DIR="$APP_DIR/Frontend"
              BACKEND_DIR="$APP_DIR/Backend"

              echo "Moving to project directory..."
              cd "$APP_DIR"

              echo "Pulling latest code..."
              git fetch origin
              git reset --hard origin/main

              echo "================ BACKEND DEPLOY ================="
              cd "$BACKEND_DIR"

              if [ ! -d "venv" ]; then
                python3 -m venv venv
              fi

              source venv/bin/activate
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              pip install gunicorn uvicorn

              echo "Restarting backend service..."
              sudo systemctl restart dta-backend
              sudo systemctl status dta-backend --no-pager || true

              echo "================ FRONTEND DEPLOY ================"
              cd "$FRONTEND_DIR"

              echo "Ensuring Node.js 20 is installed..."
              if ! command -v node >/dev/null 2>&1 || ! node -v | grep -qE '^v20\.'; then
                curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
                sudo apt-get install -y nodejs
              fi

              echo "Node version: $(node -v)"
              echo "NPM version: $(npm -v)"

              echo "Cleaning old frontend install..."
              rm -rf node_modules
              rm -f package-lock.json

              echo "Cleaning npm cache..."
              npm cache clean --force

              echo "Installing frontend dependencies..."
              npm install

              echo "Building frontend..."
              npm run build

              echo "Deploying frontend build..."
              sudo rm -rf /var/www/html/*

              if [ -d "build" ]; then
                sudo cp -r build/. /var/www/html/
              elif [ -d "dist" ]; then
                sudo cp -r dist/. /var/www/html/
              else
                echo "Error: No build or dist folder found"
                exit 1
              fi

              echo "Checking nginx config..."
              sudo nginx -t

              echo "Restarting nginx..."
              sudo systemctl restart nginx
              sudo systemctl status nginx --no-pager || true

              echo "Deployment completed successfully."
          EOF
