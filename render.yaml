services:
  # Backend Web Service
  - type: web
    name: dta-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: MONGO_DETAILS
      - key: DATABASE_NAME
        value: dtable_analytics
      - key: SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440

  # Frontend Static Site
  - type: static_site
    name: dta-frontend
    env: node
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 20
